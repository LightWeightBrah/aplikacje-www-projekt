plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.solid.dialer'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.solid.dialer'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
